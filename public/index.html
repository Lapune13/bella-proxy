<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>Bella — Bella Vista Assistant</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#120900;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'DM Sans',sans-serif;}
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');
.root{background:#1a0f00;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:600px;width:100%;max-width:680px;}
.hdr{background:#1a0f00;border-bottom:1px solid #2e1f0a;padding:12px 18px;display:flex;align-items:center;gap:12px;}
.hdr-av{width:38px;height:38px;border-radius:50%;background:#c8772a;display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.hdr-info{flex:1;}.hdr-name{font-size:15px;font-weight:600;color:#f5e6c8;}
.hdr-status{font-size:12px;color:#c8772a;margin-top:1px;}
.hdr-badge{background:transparent;border:1px solid #c8772a;color:#c8772a;font-size:11px;padding:3px 10px;border-radius:100px;}
.msgs{flex:1;overflow-y:auto;padding:14px 14px 8px;display:flex;flex-direction:column;gap:10px;background:#1a0f00;scroll-behavior:smooth;}
.msgs::-webkit-scrollbar{width:3px;}.msgs::-webkit-scrollbar-thumb{background:#3a2a10;border-radius:4px;}
.divider{text-align:center;font-size:11px;color:#5a4a30;padding:4px 0;}
.row{display:flex;gap:8px;align-items:flex-end;animation:fu 0.25s ease;}
.row.user{flex-direction:row-reverse;}
@keyframes fu{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:translateY(0);}}
.av{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;margin-bottom:2px;}
.av.bot{background:#c8772a;color:#1a0f00;font-size:13px;}.av.user{background:#4a3a1a;color:#f5e6c8;}
.bbl{padding:9px 13px;border-radius:16px;font-size:13.5px;line-height:1.55;max-width:82%;}
.bbl.bot{background:#2a1f0e;color:#f0dfc0;border-bottom-left-radius:4px;}
.bbl.user{background:#c8772a;color:#fff;border-bottom-right-radius:4px;}
.bbl.err{background:#2a1010;color:#f0a0a0;border-bottom-left-radius:4px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 2px 36px;animation:fu 0.3s ease;}
.chip{background:transparent;border:1px solid #c8772a;color:#c8772a;border-radius:100px;font-size:12px;padding:6px 13px;cursor:pointer;transition:background 0.15s,color 0.15s;}
.chip:hover{background:#c8772a;color:#fff;}
.typing{display:flex;gap:8px;align-items:flex-end;}
.tdots{display:flex;gap:4px;padding:10px 13px;background:#2a1f0e;border-radius:16px;border-bottom-left-radius:4px;align-items:center;}
.tdots span{width:6px;height:6px;border-radius:50%;background:#c8772a;opacity:0.5;animation:bounce 1.2s infinite;}
.tdots span:nth-child(2){animation-delay:0.2s;}.tdots span:nth-child(3){animation-delay:0.4s;}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:0.5;}30%{transform:translateY(-4px);opacity:1;}}
.inp-row{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#120a00;border-top:1px solid #2e1f0a;}
#bv-in{flex:1;border:1px solid #3a2a10;border-radius:100px;padding:9px 16px;font-size:13.5px;background:#1a1000;color:#f0dfc0;outline:none;transition:border-color 0.15s;}
#bv-in::placeholder{color:#5a4030;}#bv-in:focus{border-color:#c8772a;}
.snd{width:36px;height:36px;border-radius:50%;background:#c8772a;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.snd:hover{background:#e08830;}
.snd svg{width:15px;height:15px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>

    </div>
    <div class="hdr-badge">AI Assistant</div>
  </div>
  <div class="msgs" id="msgs"><div class="divider">Today</div></div>
  <div class="inp-row">

  </div>
</div>
