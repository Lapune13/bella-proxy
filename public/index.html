<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bella — Bella Vista</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#120900;display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:sans-serif;}
.root{background:#1a0f00;border-radius:16px;overflow:hidden;display:flex;flex-direction:column;height:600px;width:680px;}
.hdr{background:#1a0f00;border-bottom:1px solid #2e1f0a;padding:12px 18px;display:flex;align-items:center;gap:12px;}
.hdr-av{width:38px;height:38px;border-radius:50%;background:#c8772a;display:flex;align-items:center;justify-content:center;font-size:17px;}
.hdr-name{font-size:15px;font-weight:600;color:#f5e6c8;flex:1;}
.hdr-badge{border:1px solid #c8772a;color:#c8772a;font-size:11px;padding:3px 10px;border-radius:100px;}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px;}
.row{display:flex;gap:8px;align-items:flex-end;}
.row.user{flex-direction:row-reverse;}
.av{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
.av.bot{background:#c8772a;color:#1a0f00;}
.av.user{background:#4a3a1a;color:#f5e6c8;}
.bbl{padding:9px 13px;border-radius:16px;font-size:14px;line-height:1.5;max-width:80%;}
.bbl.bot{background:#2a1f0e;color:#f0dfc0;border-bottom-left-radius:4px;}
.bbl.user{background:#c8772a;color:#fff;border-bottom-right-radius:4px;}
.chips{display:flex;flex-wrap:wrap;gap:7px;padding:2px 0 2px 36px;}
.chip{background:transparent;border:1px solid #c8772a;color:#c8772a;border-radius:100px;font-size:12px;padding:6px 13px;cursor:pointer;}
.chip:hover{background:#c8772a;color:#fff;}
.dots{display:flex;gap:4px;padding:10px 13px;background:#2a1f0e;border-radius:16px;}
.dots span{width:6px;height:6px;border-radius:50%;background:#c8772a;opacity:0.5;animation:b 1.2s infinite;}
.dots span:nth-child(2){animation-delay:0.2s;}
.dots span:nth-child(3){animation-delay:0.4s;}
@keyframes b{0%,60%,100%{opacity:0.3;}30%{opacity:1;}}
.inp{display:flex;gap:8px;padding:10px 12px;background:#120a00;border-top:1px solid #2e1f0a;}
#txt{flex:1;border:1px solid #3a2a10;border-radius:100px;padding:9px 16px;font-size:14px;background:#1a1000;color:#f0dfc0;outline:none;}
#txt:focus{border-color:#c8772a;}
#btn{width:36px;height:36px;border-radius:50%;background:#c8772a;border:none;cursor:pointer;color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;}
#btn:hover{background:#e08830;}
</style>
</head>
<body>
<div class="root">
  <div class="hdr">
    <div class="hdr-av">🍕</div>
    <div class="hdr-name">Bella Vista &nbsp;<span style="font-size:11px;color:#c8772a;">● Online 24/7</span></div>
    <div class="hdr-badge">AI Assistant</div>
  </div>
  <div class="msgs" id="msgs"></div>
  <div class="inp">
    <input id="txt" placeholder="Ask me anything about Bella Vista..." autocomplete="off"/>
    <button id="btn">➤</button>
  </div>
</div>

<script>
const msgs=[];
let busy=false;

function scroll(){
  const m=document.getElementById('msgs');
  m.scrollTop=m.scrollHeight;
}

function addMsg(role,text){
  const m=document.getElementById('msgs');
  const row=document.createElement('div');
  row.className='row '+(role==='user'?'user':'');
  const av=document.createElement('div');
  av.className='av '+(role==='user'?'user':'bot');
  av.textContent=role==='user'?'U':'B';
  const bbl=document.createElement('div');
  bbl.className='bbl '+(role==='user'?'user':'bot');
  bbl.innerHTML=text;
  row.appendChild(av);
  row.appendChild(bbl);
  m.appendChild(row);
  scroll();
}

function addChips(opts){
  const m=document.getElementById('msgs');
  const d=document.createElement('div');
  d.className='chips';
  opts.forEach(o=>{
    const c=document.createElement('button');
    c.className='chip';
    c.textContent=o;
    c.onclick=()=>{d.remove();send(o);};
    d.appendChild(c);
  });
  m.appendChild(d);
  scroll();
}

function showDots(){
  const m=document.getElementById('msgs');
  const row=document.createElement('div');
  row.className='row';
  row.id='typing';
  const av=document.createElement('div');
  av.className='av bot';
  av.textContent='B';
  const d=document.createElement('div');
  d.className='dots';
  d.innerHTML='<span></span><span></span><span></span>';
  row.appendChild(av);
  row.appendChild(d);
  m.appendChild(row);
  scroll();
}

function removeDots(){
  const el=document.getElementById('typing');
  if(el)el.remove();
}

async function send(text){
  text=(text||'').trim();
  if(!text||busy)return;
  busy=true;
  document.querySelectorAll('.chips').forEach(e=>e.remove());
  addMsg('user',text);
  document.getElementById('txt').value='';
  msgs.push({role:'user',content:text});
  showDots();
  try{
    const r=await fetch('/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system:'You are Bella, the friendly AI assistant for Bella Vista, an authentic Italian restaurant at 47 Camden High Street, London NW1 7JH. Phone: +44 20 7485 1234. Hours: Mon-Wed 12pm-10:30pm, Thu 12pm-11pm, Fri 12pm-11:30pm, Sat 11:30am-11:30pm, Sun 11:30am-10pm. Menu includes wood-fired pizzas from £12.50, fresh pasta from £13.50, mains from £15.50, starters from £7.50. Delivery via Deliveroo, Uber Eats, Just Eat within 3 miles. Be warm, concise and helpful.',
        messages:msgs
      })
    });
    removeDots();
    if(!r.ok){addMsg('bot','Sorry, something went wrong. Please call +44 20 7485 1234.');busy=false;return;}
    const data=await r.json();
    const reply=data.content.map(c=>c.text||'').join('');
    msgs.push({role:'assistant',content:reply});
    addMsg('bot',reply.replace(/\n/g,'<br>'));
  }catch(e){
    removeDots();
    console.error('Error:',e);
    addMsg('bot','Connection error: '+e.message);
  }
  busy=false;
}

document.getElementById('btn').addEventListener('click',function(){
  send(document.getElementById('txt').value);
});

document.getElementById('txt').addEventListener('keydown',function(e){
  if(e.key==='Enter'){send(this.value);}
});

// Greeting
addMsg('bot','👋 Ciao! I\'m Bella, your virtual assistant at Bella Vista. How can I help you today?');
addChips(['Book a table','View menu','Opening hours','Delivery','FAQ']);
</script>
</body>
</html>
